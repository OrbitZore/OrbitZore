name: Update README with Latest Blog Posts

on:
  schedule:
    # Runs every 6 hours (UTC)
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme-with-blog:
    name: Update this repo's README with latest blog posts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Note: z3475.work uses GeoDNS with rotating CDN edges; some edges
      # are unreachable from GitHub runners, so retries are required.
      - name: Pull latest blog posts
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://z3475.work/atom.xml"
          max_item_count: "5"
          date_format: "YYYY-MM-DD"
          template: "- 📝 [$title]($url) — <sub>$date</sub>"
          retry_count: "8"
          retry_wait_time: "10"
          commit_message: "chore(bot): refresh latest blog posts"

      # Prevents GitHub from auto-disabling the scheduled workflow after 60
      # days of repository inactivity (pure-git replacement for the TOS-blocked
      # gautamkrishnar/keepalive-workflow action)
      - name: Keep repository active if idle for 50+ days
        if: github.event_name == 'schedule'
        run: |
          LAST=$(git log -1 --format=%ct)
          NOW=$(date +%s)
          AGE=$(( (NOW - LAST) / 86400 ))
          echo "Last commit was $AGE days ago"
          if [ "$AGE" -ge 50 ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keep repository active"
            git push
          fi
