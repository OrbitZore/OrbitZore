name: Generate Metrics SVG

on:
  schedule:
    # Daily at 01:00 UTC — the bot commit also keeps the repo active
    # so GitHub never auto-disables scheduled workflows
    - cron: "0 1 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/metrics.yml"]

permissions:
  contents: write

jobs:
  metrics:
    name: Generate personal metrics
    runs-on: ubuntu-latest
    steps:
      - name: Generate metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: OrbitZore
          filename: github-metrics.svg
          committer_branch: main
          committer_message: "chore(bot): update metrics"
          config_timezone: Asia/Shanghai
          base: header, activity, community, repositories, metadata
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_colors: github
