name: Generate Languages SVG

on:
  schedule:
    # Daily at 02:00 UTC
    - cron: "0 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/languages.yml"
      - ".github/scripts/gen_languages_svg.py"

permissions:
  contents: write

jobs:
  languages:
    name: Aggregate languages and render SVG
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate github-languages.svg
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/gen_languages_svg.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-languages.svg
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore(bot): update languages svg"
            git push
          fi
