name: Action access test
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose feed reachability
        run: |
          set -x
          for i in 1 2 3; do dig +short z3475.work A; sleep 2; done
          for i in 1 2 3 4 5 6; do
            curl -s -o /tmp/feed.xml -w "try$i code=%{http_code} time=%{time_total} ip=%{remote_ip}\n" --max-time 20 https://z3475.work/atom.xml && grep -c "<entry>" /tmp/feed.xml && break
          done
          ls -la /tmp/feed.xml 2>/dev/null; head -c 300 /tmp/feed.xml 2>/dev/null
